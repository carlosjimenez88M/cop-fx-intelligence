name: Deploy & Run Pipeline

on:
  # Manual trigger with optional date override
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override run date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""
      publish_tweet:
        description: "Post tweet after report generation"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        type: choice
        options: [production, staging]
        default: production

  # Automatic: called after ci.yml passes on master
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

# Only one deploy runs at a time per environment
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Gate — skip if triggered by a failed CI run
  # ──────────────────────────────────────────────────────────────────
  gate:
    name: Gate check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "CI did not succeed — skipping deploy."
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────
  # 2. Deploy — install, validate config, run pipeline
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Run COP/USD pipeline
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Validate configuration
        run: |
          uv run python - <<'EOF'
          import sys
          from cop_fx.config.settings import get_settings
          try:
              s = get_settings()
              print(f"✅  Config OK — model={s.llm_model}  env={s.environment}")
          except Exception as e:
              print(f"❌  Config error: {e}", file=sys.stderr)
              sys.exit(1)
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

      - name: Run pipeline
        id: pipeline
        run: |
          DATE_ARG=""
          if [[ -n "${{ github.event.inputs.run_date }}" ]]; then
            DATE_ARG="--date ${{ github.event.inputs.run_date }}"
          fi

          PUBLISH_ARG=""
          if [[ "${{ github.event.inputs.publish_tweet }}" == "true" ]]; then
            PUBLISH_ARG="--publish"
          fi

          uv run cop-fx run $DATE_ARG $PUBLISH_ARG | tee pipeline_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_ENABLED: ${{ github.event.inputs.publish_tweet || 'false' }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          LOG_LEVEL: INFO

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            pipeline_output.txt
          retention-days: 90

      - name: Post summary to job
        if: always()
        run: |
          echo "## Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f pipeline_output.txt ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -60 pipeline_output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No output captured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Deploy pipeline failed** on run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            }).catch(() => {})  // ignore if not in a PR context
