# ============================================================
# cop-fx-intelligence — configuración operativa (UN solo lugar)
#
# Los SECRETOS (API keys, tokens) viven en .env — aquí va todo lo demás.
# Precedencia: variable de entorno > .env > este archivo > defaults del código.
# ============================================================

# ── LLM ──────────────────────────────────────────────────────
llm_provider: openai
llm_model: gpt-5-mini          # tier 'fast': clasificación por lote (alto volumen)
llm_model_judge: gpt-5.4-mini    # tier 'judge': el adjudicador (1 llamada de alto valor)
llm_temperature: 0.0             # clasificación direccional = determinismo

# ── Noticias ─────────────────────────────────────────────────
news_max_articles: 100           # artículos a traer por corrida
gate_headlines_cap: 60           # titulares que evalúa el gate de materialidad
min_analyzable_chars: 80         # sin cuerpo ni summary de este tamaño → se descarta
news_rss_feeds:
  # Lado COP: economía colombiana (verificados 2026-06-12: vivos y con texto)
  - https://www.larepublica.co/rss/economia      # cuerpo completo extraíble (~2.800 chars)
  - https://www.portafolio.co/rss/economia.xml   # paywall: solo resumen de 1 línea
  # Lado USD: macro global / Fed
  - https://www.cnbc.com/id/20910258/device/rss/rss.html  # cuerpo extraíble (~1.800 chars)

# ── Keywords / GOLD query ────────────────────────────────────
keyword_llm_judge_enabled: true  # el LLM filtra términos accionables antes del grafo
keyword_top_n: 25                # términos a mostrar en dashboard/notebooks
keyword_min_articles: 1          # mínimo de noticias por término (GOLD es pequeño)
keyword_pairwise_min_correlation: 0.20
keyword_pairwise_min_joint: 2    # pares recurrentes; si no se repiten, no entran al dashboard
keyword_pairwise_top_n: 80
keyword_domain_stopwords:
  # Genéricos del universo COP/USD: frecuentes, pero poco explicativos.
  - colombia
  - colombiano
  - colombiana
  - colombianos
  - colombianas
  - pais
  - país
  - gobierno
  - nacional
  - economia
  - economía
  - mercado
  - mercados
  - cop
  - usd
  - dolar
  - dólar

# ── Agentes ──────────────────────────────────────────────────
max_topic_workers: 6             # cota del fan-out (Send) — controla costo
ts_neutral_band_pct: 0.10        # |Δ%| del forecast bajo esto = la serie se abstiene
market_dead_band_pct: 0.30       # movimiento del equity bajo esto = sin sesgo de mercado

# ── FX / forecast ────────────────────────────────────────────
fx_base_currency: USD
fx_quote_currency: COP
fx_lookback_days: 365
forecast_horizon_days: 7

# ── App ──────────────────────────────────────────────────────
environment: development
log_level: INFO
report_output_dir: reports       # relativo = se resuelve contra la raíz del repo
twitter_enabled: false
