[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cop-fx-intelligence"
version = "0.1.0"
description = "COP/USD FX intelligence pipeline with AI-powered forecasting and news analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "carlosdaniel", email = "danieljimenez88m@gmail.com" }]
keywords = ["forex", "cop", "usd", "forecasting", "langgraph", "nlp"]

dependencies = [
    # LLM / Agent framework
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    # Time-series forecasting
    "prophet>=1.1",
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    # Social publishing
    "tweepy>=4.14",
    # Settings / config
    "pydantic-settings>=2.4",
    "pydantic>=2.8",
    # HTTP / feeds / scraping
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Data manipulation
    "pandas>=2.2",
    "numpy>=1.26",
    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "structlog>=24.4",
    "openai>=2.38.0",
    "transformers>=5.10.2",
    "pyarrow>=24.0.0",
    "networkx>=3.6.1",
    "streamlit>=1.58.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.scripts]
cop-fx = "cop_fx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cop_fx"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "ANN",      # flake8-annotations (partial)
    "RUF",      # ruff-specific
]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["cop_fx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["notebooks/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/cop_fx --cov-report=term-missing --cov-report=xml"
markers = [
    "unit: fast unit tests (no external I/O)",
    "integration: end-to-end tests that hit real APIs",
    "slow: tests that take > 10s",
]

[tool.coverage.run]
source = ["src/cop_fx"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 50

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
]
